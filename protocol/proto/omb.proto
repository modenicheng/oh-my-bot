syntax = "proto3";
package omb.v1;
option go_package = "github.com/modenicheng/oh-my-bot/server/internal/protocol/gen;ombv1";

// oh-my-bot 线上协议 v1（ADR-0012：WS 二进制帧承载）。
// 坐标系：地图中心为原点，米；1 tick = 1/60 s；角度弧度。
// 实体 id：房间内全局唯一、单调递增 uint32。
// 定点约定：hp/energy ×10 存 sint32，输入方向存千分比 int32——避免浮点序列化抖动。
// AOI：Robot/Projectile 按 20m 视野+墙体遮挡裁剪（与 scan() 同一规则）；
//      HealthPack/Core/Uplink are public map objects; Robot/Projectile use standard AOI only.
//      Core/Uplink 为地图对象，恒全量下发（数量小、状态稀疏变化）。

import "google/protobuf/timestamp.proto";

// ============ 共享 ============

message Vec2 { double x = 1; double y = 2; }

enum Phase { PHASE_UNSPECIFIED = 0; OUTER_RING = 1; CORE_OPEN = 2; }

// 控制轴来源（ADR-0009 分轴仲裁）
enum ControlSource { CS_UNSPECIFIED = 0; CS_HUMAN = 1; CS_SCRIPT = 2; CS_SNIPPET = 3; }

// ============ 上行（0x02 帧） ============

message ClientInput {
  uint32 seq = 1;    // 每连接单调递增；服务器 ack 回传，预测和解用
  int32 move_x = 2;  // 千分比 [-1000,1000]
  int32 move_y = 3;
  bool fire = 4;
  double aim = 5;    // 弧度
  bool dash = 6;
  bool shield = 7;
  bool interact = 8;
  // 本帧实际操作过的轴才置位（bit0 move / bit1 aim / bit2 fire / bit3 ability）。
  // 未置位轴 = 本帧未操作：仲裁器不视为抢占，脚本轴保持。
  uint32 axis_mask = 9;
}

message JoinRoom { string room_code = 1; string nick = 2; string color = 3; }
// Read-only full-world connection; never allocates a player or robot.
message SpectateRoom { string room_code = 1; }
message LeaveRoom {}
message AssistToggle {} // Space 按下：服务端权威三分支——辅助关→开启并清除人工接管；辅助开且任一轴被人工接管→仅将这些轴交回脚本（辅助保持开）；辅助开且全部脚本控制→关闭。事件语义，非状态
message RoomAction {
  enum Kind { NONE = 0; START = 1; ABORT = 2; RESTART = 3; WARMUP = 4; SOLO_BOTS = 5; }
  Kind kind = 1;
}
message ScriptSubmit { uint32 client_script_id = 1; string source = 2; }

// ============ Snippet 驾驶辅助（v0.3 §9-2：官方 Bot Script 模块，可查看源码） ============

enum SnippetKind {
  SNIPPET_UNSPECIFIED = 0;
  SNIPPET_AUTO_AIM = 1;         // 自动瞄准（无参数，纯直瞄不预判）
  // 2/3 已移除：自动开火并入玩家/Bot Script 职责，有限半径自动拾取
  // 被全局 Core 拾取取代（SNIPPET_GLOBAL_CORE）；编号不复用。
  SNIPPET_EMERGENCY_SHIELD = 4; // 紧急护盾（HP 阈值 0..100）
  SNIPPET_DANGER_AVOID = 5;     // 危险规避（威胁半径 m）
  SNIPPET_PATROL = 6;           // 简单巡逻（路径点 "x,y;x,y"）
  SNIPPET_GLOBAL_CORE = 7;      // 全局 Core 拾取（无参数，朝最近存活 Core 移动）
  SNIPPET_LOW_HP_HEALTH_PACK = 8; // 低血量自动拾取血包（HP 阈值 1..100）
}

// 单条 Snippet 开关与参数。参数最多 2 个：浮点参数走 p1/p2，
// 路径点等字符串参数走 s1（范围校验在服务端 catalog，坏值整条拒绝保旧）。
message SnippetSetting {
  SnippetKind kind = 1;
  bool enabled = 2;
  double p1 = 3; // 参数1（bool 语义用 0/1；阈值/半径/射程）
  double p2 = 4; // 参数2（预留：第二条数值参数）
  string s1 = 5; // 字符串参数（patrol 路径点 "x,y;x,y"）
}

// 整机 Snippet 配置上行：全量替换语义（enabled=false 的条目可省略）。
message SnippetConfig {
  repeated SnippetSetting snippets = 1;
}
message AiPrompt { string text = 1; } // AI Agent 配额内改码请求
message Say { string text = 1; } // 手动全场发言；与脚本 say 共用 3s 冷却，最多 160 字符
message ResyncRequest {} // 客户端检测快照缺口（base_tick 断链）时请求全量重同步

message ClientMsg {
  oneof payload {
    ClientInput input = 1;
    ClientInput warmup_input = 2; // 热身场漫游
    JoinRoom join = 3;
    LeaveRoom leave = 4;
    RoomAction room_action = 5;
    ScriptSubmit script_submit = 6;
    AiPrompt ai_prompt = 7;
    AssistToggle assist_toggle = 8;
    ResyncRequest resync_request = 9;
    Say say = 10;
    SpectateRoom spectate = 11;
    SnippetConfig snippet_config = 12; // 驾驶辅助配置（仅房间玩家、active match）
  }
}

// ============ 下行（0x03 帧） ============

message EntityBase {
  uint32 id = 1;
  Vec2 pos = 2;
  float heading = 3; // 炮塔朝向；底盘无朝向（全向移动）
}

message RobotState {
  EntityBase base = 1;
  sint32 hp_x10 = 2;
  sint32 energy_x10 = 3;
  bool shield_on = 4;
  bool dashing = 5;
  bool dead = 6;
  uint32 respawn_in_s = 7; // dead=true 时有效
  string nick = 8;         // 仅 full 快照携带
  string color = 9;        // 仅 full 快照携带
  bool is_partner = 10 [deprecated = true]; // 旧客户端兼容；新对局恒 false
}

message ProjectileState {
  EntityBase base = 1;
  uint32 owner_id = 2;
  string color = 3; // 服务器权威射手颜色：射手离开观察者 AOI 后弹丸仍可自足着色（旧客户端忽略）
}

message CoreState {
  EntityBase base = 1;
  sint32 value = 2;  // +10 / +25(Mega)
}

message UplinkState {
  EntityBase base = 1;
  bool ready = 2;            // 本机玩家视角：个人 CD 结束且无人在引导，可黑
  uint32 hacking_id = 3;     // 正在引导的 robot id（0=无人）
  sint32 progress_x10 = 4;   // 引导进度 0–8.0s ×10
  uint32 my_cooldown_s = 5;  // 本机玩家对该桩的剩余个人 CD（每玩家每桩独立 30s）
}

message HealthPackState {
  EntityBase base = 1;
  bool available = 2;
  uint32 respawn_in_s = 3;
}

// 自机私有状态（不下发他机）
message SelfState {
  uint32 robot_id = 1;
  ControlSource move_src = 2;   // 分轴仲裁结果（ADR-0009）
  ControlSource turret_src = 3;
  uint32 ai_rounds_left = 4;
  uint32 ai_tokens_left_k = 5;  // 千 token
  optional bool assist_on = 6; // 权威辅助状态；缺失表示旧服务器
  optional uint32 dash_ready_tick = 7; // 绝对 60Hz tick，重连后仍准确
  optional uint32 fire_ready_tick = 8;
  optional ControlSource fire_src = 9;    // 分轴仲裁结果：开火轴当前来源（ADR-0009）
  optional ControlSource ability_src = 10; // 分轴仲裁结果：技能轴当前来源（ADR-0009）
  optional uint32 manual_axes_mask = 11; // 当前被人工接管的轴位图：bit0 move / bit1 aim / bit2 fire / bit3 ability；缺失表示旧服务器
}

message SnapshotDelta {
  uint32 tick = 1;
  uint32 ack_seq = 2;        // 已确认的最新输入序号（和解用）
  Phase phase = 3;
  uint32 time_left_s = 4;    // 剩余秒
  bool full = 5;             // 首帧/重同步：全量实体表
  uint32 base_tick = 6;      // 本 delta 基于的上一快照 tick（缺口检测）
  repeated RobotState robots = 7;      // AOI 裁剪后
  repeated uint32 robot_gone = 8;      // tombstone：离开视野的实体 id
  repeated ProjectileState projectiles = 9;
  repeated uint32 projectile_gone = 10;
  repeated CoreState cores = 11;
  repeated uint32 core_gone = 12;
  repeated UplinkState uplinks = 13;
  SelfState self = 14;
  repeated HealthPackState health_packs = 15;
}

// ============ 事件（Match Event Log 的线上投影，ADR-0006） ============

message EvKill {
  uint32 killer = 1;
  uint32 victim = 2;
  uint32 assist = 3 [deprecated = true]; // 旧录像兼容；新实现使用 assists
  Vec2 at = 4;
  repeated uint32 assists = 5; // 按 robot id 升序，允许多人
  bool kill_steal = 6; // 终结者本生命伤害份额严格小于 50%
}
message EvCorePickup { uint32 by = 1; uint32 core_id = 2; sint32 value = 3; }
message EvUplinkHack { uint32 by = 1; uint32 uplink_id = 2; sint32 value = 3; } // 引导 8s 完成
message EvPhaseChange { Phase from = 1; Phase to = 2; }
message EvRespawn { uint32 robot = 1; uint32 sector = 2; }
message EvHeal { uint32 by = 1; uint32 id = 2; sint32 heal_x10 = 3; Vec2 at = 4; }
message EvSay { uint32 robot = 1; string text = 2; }
message EvHit { uint32 from = 1; uint32 to = 2; sint32 dmg = 3; } // 每次命中（含 +1 分依据）
// 表现事件只报告已发生的攻击，客户端不从弹丸消失推断命中。
message EvShot { uint32 projectile = 1; uint32 owner = 2; Vec2 at = 3; float heading = 4; string color = 5; }
message EvProjectileImpact {
  uint32 projectile = 1; uint32 owner = 2; uint32 target = 3; // 0 = 掩体/锁区
  Vec2 at = 4; bool shield = 5; bool invulnerable = 6; string color = 7; // 源色：护盾/无敌仍客户端置白
}
message EvMatchStart { uint64 map_seed = 1; uint32 players = 2; } // 开局：种子随事件落盘（回放可复现）
message EvWallHit { uint32 robot = 1; Vec2 at = 2; float impact = 3; } // 0.5s/robot 节流（铁头娃埋点）
message EvScriptError { uint32 robot = 1; string error = 2; uint32 script_rev = 3; } // 人工智障埋点
message EvMatchEnd { repeated ScoreRow scores = 1; }
message ScoreRow { uint32 robot = 1; sint32 score = 2; repeated Title titles = 3; }
message EvScoreboard { // 局内实时积分榜（服务器权威，约 1s 一拍；不落 Match Event Log，仅下发）
  repeated ScoreRow rows = 1;
  uint32 tick = 2;
}
enum Title {
  TITLE_UNSPECIFIED = 0;
  WAR_MACHINE = 1;      // 战争机器：击毁最多
  SCAVENGER = 2;        // 垃圾佬：Core 最多
  SIGNAL_THIEF = 3;     // 信号大盗：Uplink 最多
  RUNNER = 4;           // 跑路大师
  WALL_HEAD = 5;        // 铁头娃：撞墙最多
  SURVIVOR = 6;         // 苟王
  PEACEMAKER = 7;       // 和平使者
  AI_IDIOT = 8;         // 人工智障
  BARRAGE = 9;          // 弹幕大师
  BEST_PARTNER = 10 [deprecated = true]; // 保留旧录像枚举，不再授予
  AI_REGULAR = 11;      // AI 常客
  OLD_SCHOOL = 12;      // 古法编程
  CNMB = 13;            // 充能面包：被击毁最多
  KILL_STEAL = 14;      // 抢人头：抢头次数最多
  HEALER = 15;          // 耐活王：累计实际回血最多
}

message EvScriptResult { // ScriptSubmit 的应答（nack 不落事件日志，仅下发）
  uint32 client_script_id = 1;
  bool ok = 2;
  string error = 3; // 编译/加载错误摘要
  uint32 script_rev = 4; // 服务器侧版本号（单调递增）
}

message SnippetSourceView { // 单条官方 Snippet 的可查看源码（当教材）
  SnippetKind kind = 1;
  string title = 2;
  string source = 3; // 官方模块源码（与服务器组合执行的同一定稿）
  double default_p1 = 4;
  string default_s1 = 5;
}

message EvSnippetResult { // SnippetConfig 的定向回执（不落事件日志，仅下发）
  bool ok = 1;
  string error = 2;               // 拒绝原因（参数越界/未知 kind/非法路径点）
  repeated SnippetSetting applied = 3; // 生效中的完整配置（失败时 = 旧配置）
  uint32 script_rev = 4;          // 重新组合后的脚本版本（组合失败保旧时为旧 rev）
  repeated SnippetSourceView sources = 5; // 当前服务器 catalog 全量官方源码（客户端可直接展示）
}

message EvMapBootstrap { // 开赛一次性可靠下发：地图定义（服务器为唯一 owner）
  string map_json = 1;         // MapDef 序列化（与 mapgen.Generate 同源）
  string map_hash = 2;        // 一致性校验
  uint32 generator_version = 3;
  SimTuning tuning = 4;        // 客户端可见对局数值（审计 X-3；缺失 = 旧服务器，客户端用本地兜底）
}

// SimTuning（审计 X-3）：客户端渲染/HUD 当前复算或手抄的对局数值，服务器为唯一
// owner，经 EvMapBootstrap 一次性可靠下发。只放客户端实际消费的漂移高危集
// （审计 D3/D5），不倾倒内部专用常量；不落 Match Event Log，回放不消费
// （回放积分走事件流 EvMatchEnd.scores，旧录像用客户端兜底值）。
// 定点约定与线上一致：hp/energy ×10；时长一律 tick（60Hz），客户端按 tick_rate 换算。
message SimTuning {
  uint32 tick_rate = 1;              // 服务器固定 tick 频率（HUD 冷却换算分母）
  sint32 max_hp_x10 = 2;             // HP 条分母（×10）
  sint32 max_energy_x10 = 3;         // 能量条分母（×10）
  double fire_cost = 4;              // 开火能量门槛（技能卡「EN n」显示）
  uint32 hack_duration_ticks = 5;    // Uplink 引导总时长；progress_x10 满值 = ticks×10/tick_rate
  uint32 invuln_duration_ticks = 6;  // 重生无敌时长（客户端无敌闪烁窗口）
  double vision_radius = 7;          // 视野/战争雾半径（米）
}

// EvControlNotice（审计 X-4）：结构化控制通知，取代 "join failed:" / "AI …"
// 前缀字符串协议。过渡期服务器对每条 notice 同时下发 robot=0 的 EvSay 旧形态
// （旧客户端按前缀解析；新客户端按 code 分流并对重复 say 去重）。
// 不落 Match Event Log：join 拒绝发生在对局外，AI 回执是定向消息。
message EvControlNotice {
  enum Code {
    CN_UNSPECIFIED = 0;
    // ---- join/spectate 拒绝（终态：客户端停止重试并展示原因） ----
    CN_JOIN_FAILED = 1;        // 进房/观战被拒（房间满/码无效/身份冲突等，text = 服务器原因）
    CN_READONLY_SPECTATOR = 2; // 观战连接试图执行玩家操作（只读契约）
    // ---- AI 改码状态（定向，仅 owner 可见；错误类终结面板 pending） ----
    CN_AI_REQUEST_FAILED = 10;  // 请求失败/配额拒绝
    CN_AI_DISABLED = 11;        // 服务器未启用 AI
    CN_AI_COMPILE_FAILED = 12;  // 生成脚本编译失败（旧脚本继续运行）
    CN_AI_STALE_SCRIPT = 13;    // 脚本已被手动更新，AI 结果丢弃
    CN_AI_EXPLAIN = 14;         // 改动说明（info，非错误）
  }
  Code code = 1;
  string text = 2; // 人类可读文案（过渡期与旧 say 同文）；UI 以 code 分流，text 仅展示
}

message EvAiUsage { // AI 配额事实（每次扣减/护栏触顶）
  uint32 robot = 1;
  uint32 rounds_delta = 2;
  uint32 tokens_delta = 3;    // 实际消耗（usage 字段累加）
  uint32 global_left_k = 4;   // 全局护栏余量（千 token）
}

message EvRoomState { // 房间生命周期广播（含 Session 榜）
  enum State { R_IDLE = 0; R_WARMUP = 1; R_RUNNING = 2; R_ENDED = 3; }
  State state = 1;
  uint32 robots_online = 2;
  string host_nick = 3;
  uint32 solo_bots = 4; // room-scoped deterministic test opponents; zero when disabled
}

message EvAiQuota {
  uint32 rounds_left = 1;
  uint32 tokens_used_k = 2;
  uint32 global_tokens_left_k = 3; // 全局护栏余量（2M token/局，触顶全员禁 AI）
}

// AI provider 的实时增量：服务端解析上游 SSE 后立即定向推入玩家 WS。
// 单玩家请求严格串行，因此无需 request_id；kind 区分思考过程与最终回答。
message EvAiStream {
  enum Kind {
    ANSWER = 0;
    REASONING = 1;
  }
  string delta = 1;
  Kind kind = 2;
}

message ServerEvent {
  uint32 tick = 1;
  google.protobuf.Timestamp wall = 2; // 落 Match Event Log 用的墙钟
  oneof kind {
    EvKill kill = 10;
    EvCorePickup core_pickup = 11;
    EvUplinkHack uplink_hack = 12;
    EvPhaseChange phase_change = 13;
    EvRespawn respawn = 14;
    EvSay say = 15;
    EvHit hit = 16;
    EvMatchEnd match_end = 17;
    EvRoomState room_state = 18;
    EvAiQuota ai_quota = 19;
    EvScriptResult script_result = 20;
    EvMatchStart match_start = 21;
    EvWallHit wall_hit = 22;
    EvScriptError script_error = 23;
    EvMapBootstrap map_bootstrap = 24;
    EvAiUsage ai_usage = 25;
    EvShot shot = 26;
    EvProjectileImpact projectile_impact = 27;
    EvScoreboard scoreboard = 28; // 观战/回放可见；玩家同样可收（延迟 1s 内不影响作弊面）
    EvScriptLog script_log = 29; // 仅脚本 owner session 可见，不进入 Match Event Log
    EvHeal heal = 30;
    EvSnippetUsage snippet_usage = 31; // OLD_SCHOOL 埋点：某轴最终采用 CS_SNIPPET（0.5s 节流/robot）
    EvSnippetResult snippet_result = 32; // SnippetConfig 定向回执（不落事件日志，仅 owner 下发）
    EvAiStream ai_stream = 33; // AI 上游 SSE 文本增量（仅 owner，下发即展示，不落事件日志）
    EvControlNotice control_notice = 34; // 结构化控制通知（审计 X-4；不落事件日志）
  }
}

message EvScriptLog {
  uint32 robot_id = 1;
  uint32 script_rev = 2;
  uint32 tick = 3;
  string level = 4;
  string text = 5;
  bool truncated = 6;
}

message EvSnippetUsage { // 古法编程（OLD_SCHOOL）埋点：真实 snippet 控制活动
  uint32 robot = 1;
  uint32 axes = 2; // 本 tick 最终采用 CS_SNIPPET 的轴位图（bit0 move/bit1 aim/bit2 fire/bit3 ability）
}

message ServerMsg {
  oneof payload {
    SnapshotDelta snapshot = 1;
    ServerEvent event = 2;
  }
}
