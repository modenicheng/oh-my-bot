name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # Strict wall-clock script quotas are production behavior; serialize packages so
      # unrelated package tests cannot steal their 5–12 ms scheduling windows.
      - name: go test (serial packages for timing gates)
        run: go test -p 1 -timeout 10m ./...

      - name: go test (race, short)
        run: go test -race -short -timeout 10m ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: install (lockfile is authoritative)
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests (vitest run, no e2e)
        run: pnpm test
