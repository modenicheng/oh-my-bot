<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oh-my-bot</title>
  <style>
    /* tokens: client/STYLE.md — 暗底 #0a0e14/#10141a、1px #1f2733 描边、radius 0、荧光只做状态高亮 */
    :root {
      --bg: #0a0e14; --panel: #10141a; --line: #1f2733;
      --fg: #d8dee9; --fg-dim: #8b98a9;
      --accent: #22d3ee; --danger: #ff5c5c; --lime: #a3e635; --amber: #fbbf24;
      --mono: ui-monospace, "JetBrains Mono", monospace;
    }
    html, *, *::before, *::after { box-sizing: inherit; }
body { margin: 0; height: 100%; box-sizing: border-box; min-width: 0; background: var(--bg); color: var(--fg);
                 font: 14px/1.6 Inter, system-ui, sans-serif; display: grid; place-items: center; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
                   background-image: linear-gradient(var(--line) 1px, transparent 1px),
                                     linear-gradient(90deg, var(--line) 1px, transparent 1px);
                   background-size: 24px 24px; opacity: .04; }
    .panel { border: 1px solid var(--line); background: var(--panel); padding: 28px 32px;
             width: 340px; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 15px; letter-spacing: .35em; font-weight: 600; color: var(--fg); }
    .sub { font-size: 12px; color: var(--fg-dim); letter-spacing: .2em; }
    label { display: flex; flex-direction: column; gap: 6px;
            font-size: 12px; color: var(--fg-dim); }
    input[type=text] { border: 1px solid var(--line); background: var(--bg); color: var(--fg);
                       padding: 8px 10px; font: inherit; outline: none; }
    input[type=text]:focus { border-color: var(--accent); }
    #in-room { font-family: var(--mono); letter-spacing: .3em; text-transform: uppercase; }
    .field-label { font-size: 12px; color: var(--fg-dim); letter-spacing: .2em; }
    .hint { font-size: 11px; color: var(--fg-dim); }
    #swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .swatch { width: 100%; aspect-ratio: 1; border: 1px solid var(--line); padding: 0;
              cursor: pointer; background: var(--sw); }
    .swatch:hover { border-color: var(--sw); }
    .swatch.sel { outline: 1px solid var(--sw); box-shadow: 0 0 6px color-mix(in srgb, var(--sw) 35%, transparent); }
    button.act { border: 1px solid var(--accent); background: transparent; color: var(--accent);
                 padding: 9px 0; font: inherit; letter-spacing: .25em; cursor: pointer; }
    button.act:hover:not(:disabled) { box-shadow: 0 0 12px #22d3ee40; }
    button.act:disabled { opacity: .45; cursor: default; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button.danger:hover:not(:disabled) { box-shadow: 0 0 12px #ff5c5c40; }
    .error-line { font-size: 12px; color: var(--danger); min-height: 1.2em; }
    /* 大厅 */
    #room-code { font-family: var(--mono); font-size: 34px; letter-spacing: .3em; color: var(--accent);
                 padding: 6px 0 2px; border: 1px solid var(--line); background: var(--bg);
                 text-align: center; }
    #members { list-style: none; margin: 0; padding: 10px 12px; border: 1px solid var(--line);
               background: var(--bg); min-height: 64px; font-size: 13px; }
    #members .placeholder { color: var(--fg-dim); }
    .m-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    .m-row.stale { opacity: .55; }
    .m-dot { width: 8px; height: 8px; background: var(--c, var(--fg-dim)); flex: none; }
    .m-name { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m-tag { margin-left: auto; color: var(--fg-dim); font-size: 11px; letter-spacing: .12em; flex: none; }
    .m-count { color: var(--fg-dim); font-size: 12px; padding-top: 6px; margin-top: 6px;
               border-top: 1px solid var(--line); }
    /* 房主操作栏：START/WARMUP（RoomAction），非房主显示等待提示 */
    #room-actions { display: flex; flex-direction: column; gap: 8px; }
    .room-notice { font-family: var(--mono); font-size: 12px; color: var(--fg-dim);
                   letter-spacing: .15em; padding: 2px 0; }
    #room-state { font-family: var(--mono); font-size: 12px; color: var(--fg-dim); }
    #status { font-family: var(--mono); font-size: 13px; display: flex; align-items: center;
              gap: 8px; color: var(--fg-dim); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
           box-shadow: 0 0 8px #ff5c5c40; flex: none; }
    .ok #status { color: var(--accent); }
    .ok .dot { background: var(--accent); box-shadow: 0 0 8px #22d3ee40; }
    .down #status { color: var(--danger); }
    [hidden] { display: none !important; }
    #view-join { display: flex; flex-direction: column; gap: 14px; }
    /* 游戏视图：全屏 canvas + HUD 覆盖层（#app 面板化布局在此视图下解除） */
    #view-game { position: fixed; inset: 0; display: block; }
    #view-game[hidden] { display: none !important; }
    #game-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    #hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--mono); }
    .hud-top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
               display: flex; gap: 14px; align-items: baseline; }
    .hud-phase { font-size: 12px; letter-spacing: .25em; color: var(--accent);
                 border: 1px solid var(--line); background: #10141acc; padding: 3px 10px; }
    .hud-clock { font-size: 22px; color: var(--fg); border: 1px solid var(--line);
                 background: #10141acc; padding: 2px 12px; }
    .hud-msg { position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
               font-size: 12px; color: var(--fg); background: #10141acc; border: 1px solid var(--line);
               padding: 3px 10px; opacity: 0; transition: opacity .25s; max-width: 60%; }
    .hud-msg.show { opacity: 1; }
    .hud-left { position: absolute; left: 16px; bottom: 16px; width: 240px; }
    .hud-bar-label { font-size: 11px; letter-spacing: .2em; color: var(--fg-dim);
                     display: flex; justify-content: space-between; margin-bottom: 3px; }
    .hud-bar { border: 1px solid var(--line); background: #10141a; height: 10px;
               position: relative; margin-bottom: 8px; }
    .hud-bar-fill { position: absolute; inset: 0; width: 100%;
                    transform-origin: left; transition: width .1s linear; }
    #hud-hp-fill { background: var(--danger); }
    #hud-en-fill { background: var(--amber); }
    .hud-right { position: absolute; right: 16px; bottom: 16px; width: 220px;
                 border: 1px solid var(--line); background: #10141acc; padding: 8px 10px; }
    .hud-right-label { font-size: 11px; letter-spacing: .2em; color: var(--fg-dim); margin-bottom: 6px; }
    .hud-score-row { font-size: 12px; color: var(--fg); white-space: nowrap;
                     overflow: hidden; text-overflow: ellipsis; }
    .hud-assist { position: absolute; right: 16px; top: 14px; font-size: 12px;
                  letter-spacing: .25em; color: var(--accent); border: 1px solid var(--line);
                  background: #10141acc; padding: 3px 10px; }
    .hud-assist.off { color: var(--fg-dim); }
    .hud-hint { position: absolute; left: 16px; top: 14px; font-size: 11px; color: var(--fg-dim);
                line-height: 1.8; border: 1px solid var(--line); background: #10141acc;
                padding: 6px 10px; }
    /* 结算覆盖层 */
    .end-overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
                   align-items: center; justify-content: center; gap: 18px;
                   background: #0a0e14e6; pointer-events: none; }
    .end-title { font-size: 26px; letter-spacing: .5em; color: var(--accent); }
    .end-list { display: flex; flex-direction: column; gap: 4px; min-width: 320px;
                border: 1px solid var(--line); background: var(--panel); padding: 14px 20px; }
    .end-row { display: flex; align-items: baseline; gap: 12px; font-family: var(--mono);
               font-size: 14px; }
    .end-rank { color: var(--fg-dim); width: 2ch; }
    .end-name { flex: 1; color: var(--fg); }
    .end-score { color: var(--accent); }
    .end-title-row { font-size: 12px; color: var(--amber); padding-left: 3ch; }
    .end-empty { color: var(--fg-dim); font-size: 13px; }
    .end-back { pointer-events: auto; border: 1px solid var(--accent); background: transparent;
                color: var(--accent); padding: 8px 28px; font: inherit; letter-spacing: .25em;
                cursor: pointer; }
    .end-back:hover { box-shadow: 0 0 12px #22d3ee40; }
    /* 回放库（列表） */
    #view-replays { display: flex; flex-direction: column; gap: 14px; }
    #replay-list { border: 1px solid var(--line); background: var(--bg); padding: 10px 12px;
                   min-height: 120px; max-height: 320px; overflow-y: auto; display: flex;
                   flex-direction: column; gap: 6px; font-family: var(--mono); }
    #replay-list .placeholder { color: var(--fg-dim); font-size: 12px; }
    .replay-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px;
                   border: 1px solid var(--line); background: var(--panel); cursor: pointer;
                   font-size: 13px; color: var(--fg); text-align: left; font-family: inherit; width: 100%; }
    .replay-item:hover { border-color: var(--accent); box-shadow: 0 0 10px #22d3ee30; }
    .replay-item .ri-id { font-family: var(--mono); color: var(--accent); flex: none; }
    .replay-item .ri-meta { color: var(--fg-dim); font-size: 11px; margin-left: auto; flex: none; }
    /* 回放器（全屏） */
    #view-replay-player { position: fixed; inset: 0; display: block; }
    #view-replay-player[hidden] { display: none !important; }
    #replay-canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
    #rp-hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--mono); }
    .rp-top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
              display: flex; gap: 14px; align-items: center; }
    .rp-phase { font-size: 12px; letter-spacing: .25em; color: var(--accent);
                border: 1px solid var(--line); background: #10141acc; padding: 3px 10px; }
    .rp-clock { font-size: 22px; color: var(--fg); border: 1px solid var(--line);
                background: #10141acc; padding: 2px 12px; }
    .rp-follow { position: absolute; right: 16px; top: 14px; font-size: 12px; color: var(--fg);
                 border: 1px solid var(--line); background: #10141acc; padding: 3px 10px;
                 pointer-events: auto; cursor: pointer; }
    .rp-follow:hover { border-color: var(--accent); }
    .rp-score { position: absolute; right: 16px; bottom: 96px; width: 260px;
                border: 1px solid var(--line); background: #10141acc; padding: 8px 10px; }
    .rp-score-label { font-size: 11px; letter-spacing: .2em; color: var(--fg-dim); margin-bottom: 6px; }
    .rp-score-row { display: flex; align-items: center; gap: 8px; font-size: 12px;
                    white-space: nowrap; padding: 1px 0; }
    .rp-score-dot { width: 8px; height: 8px; background: var(--c, var(--fg)); flex: none; }
    .rp-score-nick { color: var(--fg); overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
    .rp-score-detail { color: var(--fg-dim); font-size: 10px; flex: 1; }
    .rp-score-total { color: var(--accent); flex: none; }
    #rp-status { position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
                 font-size: 12px; color: var(--fg-dim); background: #10141acc;
                 border: 1px solid var(--line); padding: 3px 10px; }
    /* 控制条：时间轴 + 标记 + 按钮 */
    .rp-controls { position: absolute; left: 50%; transform: translateX(-50%); bottom: 20px;
                   width: min(720px, 90vw); display: flex; flex-direction: column; gap: 8px;
                   pointer-events: auto; }
    .rp-marks-wrap { position: relative; height: 26px; }
    #rp-marks { position: absolute; inset: 0; pointer-events: auto; }
    .rp-mark { position: absolute; top: 2px; width: 6px; height: 6px; transform: translateX(-50%);
               border-radius: 50%; background: var(--mc, var(--fg-dim)); cursor: pointer; }
    .rp-mark:hover { box-shadow: 0 0 8px var(--mc, var(--fg-dim)); }
    .rp-mark-kill { --mc: var(--danger); }
    .rp-mark-core { --mc: var(--amber); }
    .rp-mark-uplink { --mc: var(--accent); }
    .rp-mark-phase { --mc: var(--lime); }
    .rp-mark-start, .rp-mark-end { --mc: var(--fg-dim); }
    #rp-timeline { position: absolute; bottom: 0; left: 0; right: 0; width: 100%; height: 16px;
                   margin: 0; accent-color: var(--accent); cursor: pointer; }
    .rp-mark-tip { position: absolute; bottom: 30px; transform: translateX(-50%);
                   font-size: 11px; color: var(--fg); background: #10141ae6;
                   border: 1px solid var(--line); padding: 3px 8px; white-space: nowrap;
                   pointer-events: none; z-index: 2; }
    .rp-buttons { display: flex; gap: 8px; justify-content: center; }
    .rp-btn { border: 1px solid var(--line); background: #10141acc; color: var(--fg);
              padding: 6px 14px; font-family: var(--mono); font-size: 13px; cursor: pointer;
              pointer-events: auto; }
    .rp-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px #22d3ee30; }
    .rp-play { min-width: 56px; }
    .rp-speed { color: var(--accent); }
    /* 手册阅读器（client/src/manual/）：全屏双栏，STYLE.md 令牌 */
    #view-manual { position: fixed; inset: 0; display: grid;
                   grid-template-rows: auto 1fr; background: var(--bg); }
    #view-manual[hidden] { display: none !important; }
    .manual-top { display: flex; align-items: center; gap: 16px; padding: 10px 20px;
                  border-bottom: 1px solid var(--line); background: var(--panel); }
    .manual-top h1 { font-size: 13px; letter-spacing: .35em; margin: 0; flex: none; }
    #btn-manual-back { border: 1px solid var(--line); background: transparent; color: var(--fg-dim);
                       padding: 4px 14px; font: inherit; font-size: 12px; letter-spacing: .15em;
                       cursor: pointer; flex: none; }
    #btn-manual-back:hover { color: var(--accent); border-color: var(--accent); }
    #manual-breadcrumb { font-family: var(--mono); font-size: 12px; color: var(--fg-dim);
                         overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #manual-breadcrumb a { color: var(--fg-dim); text-decoration: none; }
    #manual-breadcrumb a:hover { color: var(--accent); }
    .crumb-sep { margin: 0 8px; opacity: .5; }
    .crumb-current { color: var(--fg); }
    #manual-status { font-family: var(--mono); font-size: 12px; color: var(--fg-dim);
                     margin-left: auto; flex: none; }
    .manual-main { display: grid; grid-template-columns: 264px minmax(0, 1fr);
                   min-height: 0; overflow: hidden; }
    #manual-sidebar { border-right: 1px solid var(--line); background: var(--panel);
                      overflow-y: auto; padding: 14px 0; }
    .toc-section > a { display: block; padding: 6px 18px; font-size: 13px; color: var(--fg-dim);
                       text-decoration: none; }
    .toc-section > a:hover { color: var(--fg); }
    .toc-section > a.active { color: var(--accent); border-left: 2px solid var(--accent); padding-left: 16px; }
    .toc-children { border-left: 1px solid var(--line); margin: 2px 0 8px 22px; }
    .toc-children a { display: block; padding: 4px 12px; font-size: 12px; color: var(--fg-dim);
                      text-decoration: none; }
    .toc-children a:hover { color: var(--fg); }
    .toc-children a.active { color: var(--accent); }
    #manual-content { overflow-y: auto; padding: 28px 32px 80px; scroll-behavior: smooth; }
    .manual-doc { max-width: 780px; margin: 0 auto; }
    .manual-doc h1 { font-size: 22px; letter-spacing: .05em; margin: 0 0 4px; color: var(--fg); }
    .manual-audience { font-size: 11px; font-weight: 400; letter-spacing: .15em; color: var(--fg-dim);
                       border: 1px solid var(--line); padding: 2px 8px; vertical-align: 4px;
                       margin-left: 10px; }
    .manual-body { font-size: 14px; line-height: 1.75; }
    .manual-body h2 { font-size: 16px; margin: 30px 0 10px; padding-top: 14px;
                      border-top: 1px solid var(--line); letter-spacing: .05em; }
    .manual-body h3 { font-size: 14px; margin: 22px 0 8px; color: var(--fg); }
    .manual-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid #22d3ee40; }
    .manual-body a:hover { border-bottom-color: var(--accent); }
    .manual-body code { font-family: var(--mono); font-size: 12.5px; background: var(--panel);
                        border: 1px solid var(--line); padding: 1px 5px; }
    .manual-body blockquote { margin: 12px 0; padding: 8px 16px; border-left: 2px solid var(--accent);
                              background: var(--panel); color: var(--fg-dim); }
    .manual-body table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
    .manual-body th, .manual-body td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
    .manual-body th { font-family: var(--mono); font-size: 11px; letter-spacing: .15em;
                      color: var(--fg-dim); background: var(--panel); }
    .manual-body hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
    /* 代码块：radius 0、等宽、右上角语言标签（v1 不做语法高亮） */
    .codeblock { position: relative; margin: 14px 0; border: 1px solid var(--line);
                 background: var(--panel); }
    .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
    .codeblock code { all: unset; font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
                      color: var(--fg); white-space: pre; display: block; }
    .code-lang::after { content: attr(data-lang); position: absolute; top: 0; right: 0;
                        font-family: var(--mono); font-size: 10px; letter-spacing: .2em;
                        color: var(--fg-dim); border-left: 1px solid var(--line);
                        border-bottom: 1px solid var(--line); padding: 2px 8px;
                        background: var(--bg); }
    /* 多语言 tab 组：暗底描边按钮组，激活 tab 荧光描边 */
    .code-tab-group { margin: 14px 0; border: 1px solid var(--line); background: var(--panel); }
    .code-group-note { padding: 8px 14px; font-size: 12.5px; color: var(--fg-dim);
                       border-bottom: 1px solid var(--line); }
    .code-tab-bar { display: flex; border-bottom: 1px solid var(--line); background: var(--bg); }
    .code-tab { border: 0; border-right: 1px solid var(--line); background: transparent;
                color: var(--fg-dim); font-family: var(--mono); font-size: 11px;
                letter-spacing: .2em; padding: 7px 16px; cursor: pointer; }
    .code-tab:hover { color: var(--fg); }
    .code-tab.active { color: var(--accent); background: var(--panel);
                       box-shadow: inset 0 -2px 0 var(--accent), 0 0 10px #22d3ee26; }
    .code-tab:focus-visible, #btn-manual-back:focus-visible { outline: 1px solid var(--accent);
                                                              outline-offset: -1px; }
    .code-panel { display: none; }
    .code-panel.active { display: block; }
    .code-panel pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
    .code-panel code { all: unset; font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
                       color: var(--fg); white-space: pre; display: block; }
    @media (max-width: 760px) {
      .manual-main { grid-template-columns: 1fr; }
      #manual-sidebar { display: none; }
      #manual-content { padding: 20px 16px 60px; }
    }
  </style>
</head>
<body>
  <div class="panel" id="app">
    <!-- 进房界面 -->
    <section id="view-join">
      <h1>OH-MY-BOT</h1>
      <div class="sub">进入房间</div>
      <label>房间码
        <input type="text" id="in-room" maxlength="6" spellcheck="false" autocomplete="off"
               placeholder="ABC123">
      </label>
      <label>昵称
        <input type="text" id="in-nick" maxlength="16" spellcheck="false" autocomplete="off"
               placeholder="1-16 个字符">
      </label>
      <div class="field-label">颜色</div>
      <div id="swatches"></div>
      <button type="button" class="act" id="btn-join">进入房间</button>
      <div class="error-line" id="form-error"></div>
    </section>
    <!-- 房间大厅 -->
    <section id="view-room" hidden>
      <h1>OH-MY-BOT</h1>
      <div id="room-code">······</div>
      <div class="field-label">在线成员</div>
      <ul id="members"><li class="placeholder">等待房间状态…</li></ul>
      <div id="room-actions">
        <button type="button" class="act" id="btn-start" hidden>开始对局</button>
        <button type="button" class="act" id="btn-warmup" hidden>热身场</button>
        <button type="button" class="act" id="btn-manual">手册</button>
        <button type="button" class="act" id="btn-replay">回放库</button>
        <div class="room-notice" id="room-notice" hidden></div>
      </div>
      <div id="room-state">—</div>
      <div id="status"><span class="dot"></span><span id="status-text">connecting…</span></div>
      <button type="button" class="act" id="btn-reconnect" hidden>重新连接</button>
    </section>
    <!-- 游戏视图（mapBootstrap 后显示） -->
    <section id="view-game" hidden>
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <div class="hud-top">
          <span class="hud-phase" id="hud-phase">—</span>
          <span class="hud-clock" id="hud-time">0:00</span>
        </div>
        <div class="hud-msg" id="hud-msg"></div>
        <div class="hud-hint">WASD 移动 · 鼠标瞄准 · LMB 开火<br>Shift 冲刺 · Q 护盾 · E/F 交互 · SPACE 辅助</div>
        <div class="hud-assist" id="hud-assist">ASSIST ON</div>
        <div class="hud-left">
          <div class="hud-bar-label"><span>HP</span><span id="hud-hp-text">100</span></div>
          <div class="hud-bar"><div class="hud-bar-fill" id="hud-hp-fill"></div></div>
          <div class="hud-bar-label"><span>EN</span><span id="hud-en-text">100</span></div>
          <div class="hud-bar"><div class="hud-bar-fill" id="hud-en-fill"></div></div>
        </div>
        <div class="hud-right">
          <div class="hud-right-label">场上机器人</div>
          <div id="hud-score-rows"></div>
        </div>
      </div>
    </section>
    <!-- 手册阅读器（大厅按钮进入；client/src/manual/） -->
    <section id="view-manual" hidden>
      <div class="manual-top">
        <button type="button" id="btn-manual-back">← 返回大厅</button>
        <h1>MANUAL</h1>
        <div id="manual-breadcrumb"></div>
        <div id="manual-status"></div>
      </div>
      <div class="manual-main">
        <nav id="manual-sidebar" aria-label="手册目录"></nav>
        <main id="manual-content"></main>
      </div>
    </section>
    <!-- 回放库（对局列表） -->
    <section id="view-replays" hidden>
      <h1>OH-MY-BOT</h1>
      <div class="sub">回放库</div>
      <div id="replay-list" aria-label="对局列表"><div class="placeholder">载入中…</div></div>
      <div class="error-line" id="replay-error"></div>
      <button type="button" class="act" id="btn-replays-back">返回大厅</button>
    </section>
    <!-- 回放器（全屏 canvas + 控制条） -->
    <section id="view-replay-player" hidden>
      <canvas id="replay-canvas"></canvas>
      <div id="rp-hud">
        <div class="rp-top">
          <button type="button" class="rp-btn" id="rp-return">← 返回</button>
          <span class="rp-phase" id="rp-phase">—</span>
          <span class="rp-clock" id="rp-time">0:00</span>
        </div>
        <div class="rp-follow" id="rp-follow">视角: 全景</div>
        <div class="rp-score"><div class="rp-score-label">比分</div><div id="rp-score"></div></div>
        <div id="rp-status" hidden>载入中…</div>
        <div class="rp-controls">
          <div class="rp-marks-wrap">
            <div id="rp-marks"></div>
            <input type="range" id="rp-timeline" min="0" max="1" value="0" step="1" aria-label="时间轴">
            <div class="rp-mark-tip" id="rp-mark-tip" hidden></div>
          </div>
          <div class="rp-buttons">
            <button type="button" class="rp-btn" id="rp-back" title="-1s">⏪</button>
            <button type="button" class="rp-btn rp-play" id="rp-play">▶</button>
            <button type="button" class="rp-btn" id="rp-fwd" title="+1s">⏩</button>
            <button type="button" class="rp-btn rp-speed" id="rp-speed">1×</button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
