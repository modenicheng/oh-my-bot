<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oh-my-bot</title>
  <style>
    /* tokens: client/STYLE.md — 暗底 #0a0e14/#10141a、1px #1f2733 描边、radius 0、荧光只做状态高亮 */
    :root {
      --bg: #0a0e14; --panel: #10141a; --line: #1f2733;
      --fg: #d8dee9; --fg-dim: #8b98a9;
      --accent: #22d3ee; --danger: #ff5c5c; --lime: #a3e635; --amber: #fbbf24;
      --mono: ui-monospace, "JetBrains Mono", monospace;
    }
    html, *, *::before, *::after { box-sizing: inherit; }
body { margin: 0; height: 100%; box-sizing: border-box; min-width: 0; background: var(--bg); color: var(--fg);
                 font: 14px/1.6 Inter, system-ui, sans-serif; display: grid; place-items: center; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
                   background-image: linear-gradient(var(--line) 1px, transparent 1px),
                                     linear-gradient(90deg, var(--line) 1px, transparent 1px);
                   background-size: 24px 24px; opacity: .04; }
    .panel { border: 1px solid var(--line); background: var(--panel); padding: 28px 32px;
             width: 340px; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 15px; letter-spacing: .35em; font-weight: 600; color: var(--fg); }
    .sub { font-size: 12px; color: var(--fg-dim); letter-spacing: .2em; }
    label { display: flex; flex-direction: column; gap: 6px;
            font-size: 12px; color: var(--fg-dim); }
    input[type=text] { border: 1px solid var(--line); background: var(--bg); color: var(--fg);
                       padding: 8px 10px; font: inherit; outline: none; }
    input[type=text]:focus { border-color: var(--accent); }
    #in-room { font-family: var(--mono); letter-spacing: .3em; text-transform: uppercase; }
    .field-label { font-size: 12px; color: var(--fg-dim); letter-spacing: .2em; }
    .hint { font-size: 11px; color: var(--fg-dim); }
    #swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .swatch { width: 100%; aspect-ratio: 1; border: 1px solid var(--line); padding: 0;
              cursor: pointer; background: var(--sw); }
    .swatch:hover { border-color: var(--sw); }
    .swatch.sel { outline: 1px solid var(--sw); box-shadow: 0 0 6px color-mix(in srgb, var(--sw) 35%, transparent); }
    button.act { border: 1px solid var(--accent); background: transparent; color: var(--accent);
                 padding: 9px 0; font: inherit; letter-spacing: .25em; cursor: pointer; }
    button.act:hover:not(:disabled) { box-shadow: 0 0 12px #22d3ee40; }
    button.act:disabled { opacity: .45; cursor: default; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button.danger:hover:not(:disabled) { box-shadow: 0 0 12px #ff5c5c40; }
    .error-line { font-size: 12px; color: var(--danger); min-height: 1.2em; }
    /* 大厅 */
    #room-code { font-family: var(--mono); font-size: 34px; letter-spacing: .3em; color: var(--accent);
                 padding: 6px 0 2px; border: 1px solid var(--line); background: var(--bg);
                 text-align: center; }
    #members { list-style: none; margin: 0; padding: 10px 12px; border: 1px solid var(--line);
               background: var(--bg); min-height: 64px; font-size: 13px; }
    #members .placeholder { color: var(--fg-dim); }
    .m-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    .m-row.stale { opacity: .55; }
    .m-dot { width: 8px; height: 8px; background: var(--c, var(--fg-dim)); flex: none; }
    .m-name { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m-tag { margin-left: auto; color: var(--fg-dim); font-size: 11px; letter-spacing: .12em; flex: none; }
    .m-count { color: var(--fg-dim); font-size: 12px; padding-top: 6px; margin-top: 6px;
               border-top: 1px solid var(--line); }
    /* 房主操作栏：START/WARMUP（RoomAction），非房主显示等待提示 */
    #room-actions { display: flex; flex-direction: column; gap: 8px; }
    .room-notice { font-family: var(--mono); font-size: 12px; color: var(--fg-dim);
                   letter-spacing: .15em; padding: 2px 0; }
    #room-state { font-family: var(--mono); font-size: 12px; color: var(--fg-dim); }
    #status { font-family: var(--mono); font-size: 13px; display: flex; align-items: center;
              gap: 8px; color: var(--fg-dim); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
           box-shadow: 0 0 8px #ff5c5c40; flex: none; }
    .ok #status { color: var(--accent); }
    .ok .dot { background: var(--accent); box-shadow: 0 0 8px #22d3ee40; }
    .down #status { color: var(--danger); }
    [hidden] { display: none !important; }
    #view-join { display: flex; flex-direction: column; gap: 14px; }
    /* 游戏视图：全屏 canvas + HUD 覆盖层（#app 面板化布局在此视图下解除） */
    #view-game { position: fixed; inset: 0; display: block; }
    #view-game[hidden] { display: none !important; }
    #game-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
    #hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--mono); }
    .hud-top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
               display: flex; gap: 14px; align-items: baseline; }
    .hud-phase { font-size: 12px; letter-spacing: .25em; color: var(--accent);
                 border: 1px solid var(--line); background: #10141acc; padding: 3px 10px; }
    .hud-clock { font-size: 22px; color: var(--fg); border: 1px solid var(--line);
                 background: #10141acc; padding: 2px 12px; }
    .hud-msg { position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
               font-size: 12px; color: var(--fg); background: #10141acc; border: 1px solid var(--line);
               padding: 3px 10px; opacity: 0; transition: opacity .25s; max-width: 60%; }
    .hud-msg.show { opacity: 1; }
    .hud-left { position: absolute; left: 16px; bottom: 16px; width: 240px; }
    .hud-bar-label { font-size: 11px; letter-spacing: .2em; color: var(--fg-dim);
                     display: flex; justify-content: space-between; margin-bottom: 3px; }
    .hud-bar { border: 1px solid var(--line); background: #10141a; height: 10px;
               position: relative; margin-bottom: 8px; }
    .hud-bar-fill { position: absolute; inset: 0; width: 100%;
                    transform-origin: left; transition: width .1s linear; }
    #hud-hp-fill { background: var(--danger); }
    #hud-en-fill { background: var(--amber); }
    .hud-right { position: absolute; right: 16px; bottom: 16px; width: 220px;
                 border: 1px solid var(--line); background: #10141acc; padding: 8px 10px; }
    .hud-right-label { font-size: 11px; letter-spacing: .2em; color: var(--fg-dim); margin-bottom: 6px; }
    .hud-score-row { font-size: 12px; color: var(--fg); white-space: nowrap;
                     overflow: hidden; text-overflow: ellipsis; }
    .hud-assist { position: absolute; right: 16px; top: 14px; font-size: 12px;
                  letter-spacing: .25em; color: var(--accent); border: 1px solid var(--line);
                  background: #10141acc; padding: 3px 10px; }
    .hud-assist.off { color: var(--fg-dim); }
    .hud-hint { position: absolute; left: 16px; top: 14px; font-size: 11px; color: var(--fg-dim);
                line-height: 1.8; border: 1px solid var(--line); background: #10141acc;
                padding: 6px 10px; }
    /* 结算覆盖层 */
    .end-overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
                   align-items: center; justify-content: center; gap: 18px;
                   background: #0a0e14e6; pointer-events: none; }
    .end-title { font-size: 26px; letter-spacing: .5em; color: var(--accent); }
    .end-list { display: flex; flex-direction: column; gap: 4px; min-width: 320px;
                border: 1px solid var(--line); background: var(--panel); padding: 14px 20px; }
    .end-row { display: flex; align-items: baseline; gap: 12px; font-family: var(--mono);
               font-size: 14px; }
    .end-rank { color: var(--fg-dim); width: 2ch; }
    .end-name { flex: 1; color: var(--fg); }
    .end-score { color: var(--accent); }
    .end-title-row { font-size: 12px; color: var(--amber); padding-left: 3ch; }
    .end-empty { color: var(--fg-dim); font-size: 13px; }
    .end-back { pointer-events: auto; border: 1px solid var(--accent); background: transparent;
                color: var(--accent); padding: 8px 28px; font: inherit; letter-spacing: .25em;
                cursor: pointer; }
    .end-back:hover { box-shadow: 0 0 12px #22d3ee40; }
  </style>
  <script type="module" crossorigin src="/assets/index-X2C304bW.js"></script>
</head>
<body>
  <div class="panel" id="app">
    <!-- 进房界面 -->
    <section id="view-join">
      <h1>OH-MY-BOT</h1>
      <div class="sub">进入房间</div>
      <label>房间码
        <input type="text" id="in-room" maxlength="6" spellcheck="false" autocomplete="off"
               placeholder="ABC123">
      </label>
      <label>昵称
        <input type="text" id="in-nick" maxlength="16" spellcheck="false" autocomplete="off"
               placeholder="1-16 个字符">
      </label>
      <div class="field-label">颜色</div>
      <div id="swatches"></div>
      <button type="button" class="act" id="btn-join">进入房间</button>
      <div class="error-line" id="form-error"></div>
    </section>
    <!-- 房间大厅 -->
    <section id="view-room" hidden>
      <h1>OH-MY-BOT</h1>
      <div id="room-code">······</div>
      <div class="field-label">在线成员</div>
      <ul id="members"><li class="placeholder">等待房间状态…</li></ul>
      <div id="room-actions">
        <button type="button" class="act" id="btn-start" hidden>开始对局</button>
        <button type="button" class="act" id="btn-warmup" hidden>热身场</button>
        <div class="room-notice" id="room-notice" hidden></div>
      </div>
      <div id="room-state">—</div>
      <div id="status"><span class="dot"></span><span id="status-text">connecting…</span></div>
      <button type="button" class="act" id="btn-reconnect" hidden>重新连接</button>
    </section>
    <!-- 游戏视图（mapBootstrap 后显示） -->
    <section id="view-game" hidden>
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <div class="hud-top">
          <span class="hud-phase" id="hud-phase">—</span>
          <span class="hud-clock" id="hud-time">0:00</span>
        </div>
        <div class="hud-msg" id="hud-msg"></div>
        <div class="hud-hint">WASD 移动 · 鼠标瞄准 · LMB 开火<br>Shift 冲刺 · Q 护盾 · E/F 交互 · SPACE 辅助</div>
        <div class="hud-assist" id="hud-assist">ASSIST ON</div>
        <div class="hud-left">
          <div class="hud-bar-label"><span>HP</span><span id="hud-hp-text">100</span></div>
          <div class="hud-bar"><div class="hud-bar-fill" id="hud-hp-fill"></div></div>
          <div class="hud-bar-label"><span>EN</span><span id="hud-en-text">100</span></div>
          <div class="hud-bar"><div class="hud-bar-fill" id="hud-en-fill"></div></div>
        </div>
        <div class="hud-right">
          <div class="hud-right-label">场上机器人</div>
          <div id="hud-score-rows"></div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
